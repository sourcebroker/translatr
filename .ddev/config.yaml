name: translatr
type: php
docroot: ""
no_project_mount: true
php_version: "8.3"
composer_version: "2"
webserver_type: apache-fpm
database:
    type: mariadb
    version: "10.11"
router_http_port: "80"
router_https_port: "443"
xdebug_enabled: false
additional_hostnames:
    - v13.translatr
    - v14.translatr
additional_fqdns: []
use_dns_when_possible: true
webimage_extra_packages:
    - imagemagick
